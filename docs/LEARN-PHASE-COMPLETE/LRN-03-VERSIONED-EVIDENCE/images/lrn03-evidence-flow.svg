<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-label="LRN-03 immutable source evidence and versioned database flow"><rect width="1100" height="490" rx="20" fill="#0b1220"/><text x="36" y="52" font-family="Arial" font-size="28" font-weight="700" fill="#f8fafc">LRN-03 | Trusted versioned engineering evidence</text><text x="36" y="79" font-family="Arial" font-size="15" fill="#b8c9e3">Illustrative architecture • archive first, then persist the version and its metadata</text><g text-anchor="middle" font-family="Arial"><rect x="38" y="144" width="220" height="153" rx="14" fill="#1c3555" stroke="#60a5fa"/><text x="148" y="178" font-size="20" fill="#fff" font-weight="700">Source connectors</text><text x="148" y="213" font-size="15" fill="#dbeafe">ADO work item / PR</text><text x="148" y="239" font-size="15" fill="#dbeafe">Confluence page</text><text x="148" y="266" font-size="14" fill="#bfdbfe">Native ID + revision</text><rect x="322" y="144" width="220" height="153" rx="14" fill="#185b6b" stroke="#67e8f9"/><text x="432" y="179" font-size="19" fill="#fff" font-weight="700">Evidence service</text><text x="432" y="216" font-size="15" fill="#cffafe">Stable item identity</text><text x="432" y="243" font-size="15" fill="#cffafe">SHA-256 + redaction</text><text x="432" y="269" font-size="14" fill="#cffafe">Revision validation</text><rect x="633" y="112" width="220" height="126" rx="14" fill="#175742" stroke="#6ee7b7"/><text x="743" y="150" font-size="19" fill="#fff" font-weight="700">Cloud Storage</text><text x="743" y="183" font-size="15" fill="#d1fae5">Immutable raw bytes</text><text x="743" y="206" font-size="14" fill="#d1fae5">Content hash verified</text><rect x="633" y="283" width="220" height="121" rx="14" fill="#373c70" stroke="#a5b4fc"/><text x="743" y="320" font-size="19" fill="#fff" font-weight="700">PostgreSQL</text><text x="743" y="350" font-size="15" fill="#e0e7ff">One source item</text><text x="743" y="377" font-size="15" fill="#e0e7ff">Distinct revisions + ACL</text><rect x="903" y="283" width="164" height="121" rx="14" fill="#503d2a" stroke="#fdba74"/><text x="985" y="321" font-size="17" fill="#fff" font-weight="700">Later retrieval</text><text x="985" y="351" font-size="14" fill="#ffedd5">Authorization</text><text x="985" y="374" font-size="14" fill="#ffedd5">required first</text></g><g stroke="#93c5fd" stroke-width="4" fill="none"><path d="M258 218 H312"/><path d="M542 189 H600 V176 H623"/><path d="M743 238 V273"/><path d="M853 343 H893"/></g><g fill="#93c5fd"><path d="M310 210 L323 218 310 226Z"/><path d="M621 168 L634 176 621 184Z"/><path d="M735 271 L743 284 751 271Z"/><path d="M891 335 L904 343 891 351Z"/></g><text x="37" y="448" font-family="Arial" font-size="16" fill="#e2e8f0">Replay same revision → unchanged • New revision → retained • Conflict → reject, never silently overwrite</text></svg>