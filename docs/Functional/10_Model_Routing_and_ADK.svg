<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>VisionIQ 10 - Model routing, validation and optional ADK</title>
<defs><marker id="m64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m64748Bs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
<rect width="1920" height="1080" fill="#FFFFFF"/>
<text x="60.0" y="72.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0F172A" text-anchor="start">Model Routing — Gemini, Claude and Optional ADK</text>
<text x="60.0" y="106.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Models propose; code decides what exists, who may see it, whether tests passed and whether a PR merged.</text>
<text x="1860.0" y="1052.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="end">Aligned to Master Design v1.11 — §10.8, §10.9</text>
<rect x="40" y="170" width="300" height="200" rx="10" ry="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<rect x="267.34375" y="182" width="56.65625" height="22" rx="11.0" ry="11.0" fill="#059669" stroke="none" stroke-width="0"/>
<text x="295.7" y="197.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Python</text>
<text x="56.0" y="206.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#064E3B" text-anchor="start">Evidence bundle</text>
<text x="56.0" y="236.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• From hybrid retrieval and the graph</text>
<text x="56.0" y="258.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• ACL-filtered, named snapshot</text>
<rect x="400" y="170" width="300" height="200" rx="10" ry="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<rect x="627.34375" y="182" width="56.65625" height="22" rx="11.0" ry="11.0" fill="#059669" stroke="none" stroke-width="0"/>
<text x="655.7" y="197.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Python</text>
<text x="416.0" y="206.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#064E3B" text-anchor="start">Router</text>
<text x="416.0" y="236.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Task type, policy, budget, timeout</text>
<text x="416.0" y="258.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• One provider per task by default</text>
<text x="416.0" y="280.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Logs model, prompt version, tokens</text>
<rect x="760" y="150" width="440" height="170" rx="10" ry="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="776.0" y="185.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#4C1D95" text-anchor="start">Gemini on Vertex AI — primary for</text>
<text x="776.0" y="215.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Ticket classification</text>
<text x="776.0" y="237.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Historical evidence brief</text>
<text x="776.0" y="259.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Enhancement approach</text>
<rect x="760" y="340" width="440" height="190" rx="10" ry="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="776.0" y="375.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#4C1D95" text-anchor="start">Claude — primary for</text>
<text x="776.0" y="405.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Code fix + regression test proposal</text>
<text x="776.0" y="427.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Second opinion: conflicting evidence, high-impact tickets,</text>
<text x="785.4" y="449.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">disputed root causes</text>
<rect x="1260" y="150" width="620" height="380" rx="10" ry="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="1276.0" y="186.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="start">Independent checks — not a second model</text>
<text x="1276.0" y="216.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Citation validator: every statement maps to a retrievable source span; unsupported text</text>
<text x="1285.4" y="238.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">removed or qualified</text>
<text x="1276.0" y="260.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Isolated runner + CI: real red-green results decide the test verdict</text>
<text x="1276.0" y="282.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Policy gates: protected paths, secrets, dependency changes</text>
<text x="1276.0" y="304.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Human gate: engineer approves; bot cannot merge</text>
<text x="1276.0" y="326.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Conflicting hypotheses stay DISPUTED — no invented confidence</text>
<path d="M 340.0 270.0 L 400.0 270.0" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<path d="M 700.0 235.0 L 760.0 235.0" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#m64748B)"/>
