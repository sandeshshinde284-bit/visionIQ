<path d="M 1200.0 235.0 L 1260.0 235.0" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<path d="M 1200.0 435.0 L 1260.0 435.0" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#m64748B)"/>
<rect x="40" y="590" width="900" height="150" rx="10" ry="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
<text x="56.0" y="625.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#7F1D1D" text-anchor="start">Provider outage or budget exceeded</text>
<text x="56.0" y="655.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Try the other provider only if policy and budget allow</text>
<text x="56.0" y="677.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Otherwise: PARTIAL status with deterministic evidence — never invented advice</text>
<rect x="980" y="590" width="900" height="150" rx="10" ry="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
<text x="996.0" y="625.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#7F1D1D" text-anchor="start">Claude data boundary</text>
<text x="996.0" y="655.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Direct Claude API calls leave Google Cloud</text>
<text x="996.0" y="677.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Source and code may be sent only after the egress decision (D04) is approved</text>
<rect x="40" y="780" width="1840" height="170" rx="10" ry="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="56.0" y="815.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Google ADK — optional, inside the Python service, after the win condition works</text>
<text x="56.0" y="845.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• May run bounded retrieval or investigation steps behind the same ModelProvider interface</text>
<text x="56.0" y="867.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Build deterministic orchestration first; keep ADK only if it is simpler or measurably better (task S08-09)</text>
<text x="56.0" y="889.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">• Never used for ingestion, ACL filtering, source of truth, CI verdicts, merge approval or publishing verified lessons</text>
</svg>
