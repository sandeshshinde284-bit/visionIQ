# Defect Intelligence application | VisionIQ team | local DEV environment.
# Local development stack: PostgreSQL with pgvector, the Pub/Sub emulator, the .NET API and the Python
# Intelligence service.
# Everything:        docker compose up --build -d
# Database only:     docker compose up -d postgres
# Needs DB_LOCAL_PASSWORD in your .env (see .env.example).
# The containers always use the DB_LOCAL_* settings and talk to each other by service name
# (postgres, intelligence), whichever target ./scripts/use-db.ps1 has selected for host runs.
name: defect-intelligence

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_LOCAL_NAME:-visioniq}
      POSTGRES_USER: ${DB_LOCAL_USER:-visioniq}
      POSTGRES_PASSWORD: ${DB_LOCAL_PASSWORD:?Set DB_LOCAL_PASSWORD in .env}
    # m-5: published on localhost only, not on every network interface.
    ports:
      - "127.0.0.1:${DB_LOCAL_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the data volume is first created.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_LOCAL_USER:-visioniq} -d ${DB_LOCAL_NAME:-visioniq}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pubsub:
    # FND-05: local Pub/Sub. Push subscriptions call the services by name; dead-lettering is not enforced
    # by the emulator (cloud subscriptions get it from scripts/pubsub/provision-pubsub.ps1).
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085", "--project=visioniq-local"]
    ports:
      - "127.0.0.1:8085:8085"

  pubsub-init:
    # Creates topics, dead-letter topics and push subscriptions from contracts/events/topology.json.
    image: visioniq-intelligence:local
    depends_on:
      pubsub:
        condition: service_started
      intelligence:
        condition: service_started
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_PROJECT_ID: visioniq-local
      # Where the emulator pushes events. Defaults are the services in this file. To run a service
      # on the host instead (Intelligence needs that for the fix pipeline and for Google
      # credentials), point its URL at the host, e.g. http://host.docker.internal:8000.
      EVENTS_PUSH_BASE_URL_API: ${EVENTS_PUSH_BASE_URL_API:-http://api:5100}
      EVENTS_PUSH_BASE_URL_INTELLIGENCE: ${EVENTS_PUSH_BASE_URL_INTELLIGENCE:-http://intelligence:8000}
    command: ["python", "-m", "app.events.emulator_setup"]
    restart: "no"

  db-migrate:
    # Runs on both new and existing volumes, before app containers start.
    build:
      context: .
      dockerfile: db/Dockerfile
    image: visioniq-db-migrate:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TARGET: local
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_LOCAL_NAME: ${DB_LOCAL_NAME:-visioniq}
      DB_LOCAL_USER: ${DB_LOCAL_USER:-visioniq}
      DB_LOCAL_PASSWORD: ${DB_LOCAL_PASSWORD:?Set DB_LOCAL_PASSWORD in .env}
      DB_API_USER: ${DB_API_USER:-visioniq_api}
      DB_API_PASSWORD: ${DB_API_PASSWORD:?Set DB_API_PASSWORD in .env}
      DB_INTELLIGENCE_USER: ${DB_INTELLIGENCE_USER:-visioniq_intelligence}
      DB_INTELLIGENCE_PASSWORD: ${DB_INTELLIGENCE_PASSWORD:?Set DB_INTELLIGENCE_PASSWORD in .env}
    command: ["python", "-m", "db.manage", "all"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/VisionIQ.Api/Dockerfile
    image: visioniq-api:local
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5100
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_LOCAL_NAME:-visioniq}
      DB_API_USER: ${DB_API_USER:?Set DB_API_USER in .env}
      DB_API_PASSWORD: ${DB_API_PASSWORD:?Set DB_API_PASSWORD in .env}
      DB_SSL_MODE: disable
      PYTHON_SERVICE_URL: http://intelligence:8000
      TENANT_ID: ${TENANT_ID:-visioniq-dev}
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_PROJECT_ID: visioniq-local
      EVENTS_DISPATCH_ENABLED: "true"
      # BRF-01 ticket pickup: off while PICKUP_POLICY_FILE is empty (e.g. /app/config/pickup-policy.local.json).
      PICKUP_POLICY_FILE: ${PICKUP_POLICY_FILE:-}
      PICKUP_WEBHOOK_SECRET: ${PICKUP_WEBHOOK_SECRET:-}
      PICKUP_SWEEP_INTERVAL_MINUTES: ${PICKUP_SWEEP_INTERVAL_MINUTES:-15}
      PICKUP_SWEEP_LOOKBACK_HOURS: ${PICKUP_SWEEP_LOOKBACK_HOURS:-24}
      # Pilot switch: comma-separated work-item ids. When set, no other work item is ever picked up.
      PICKUP_ALLOWED_WORK_ITEM_IDS: ${PICKUP_ALLOWED_WORK_ITEM_IDS:-}
      ADO_ORG_URL: ${ADO_ORG_URL:-}
      ADO_READ_PAT: ${ADO_READ_PAT:-}
      # BRF-05 brief delivery: off | record (kept in the database, no external call) | ado (posts a
      # work-item comment with ADO_COMMENT_PAT, a separate write token; never the read token).
      BRIEF_PUBLISH_MODE: ${BRIEF_PUBLISH_MODE:-off}
      ADO_COMMENT_PAT: ${ADO_COMMENT_PAT:-}
      # DEF-05 draft pull requests: off | record (kept in the database, no external call) | ado (pushes
      # a branch and opens a DRAFT pull request with ADO_PR_PAT, a third token that may create branches
      # and pull requests and must not be able to approve or complete them).
      FIX_PR_MODE: ${FIX_PR_MODE:-off}
      ADO_PR_PAT: ${ADO_PR_PAT:-}
      # After a defect ticket's brief, ask Intelligence for a fix run (needs DEFECT_PIPELINE_ENABLED there).
      FIX_AUTO_START: ${FIX_AUTO_START:-false}
    volumes:
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:5100:5100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5100/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  intelligence:
    build:
      context: .
      dockerfile: src/VisionIQ.Intelligence/Dockerfile
    image: visioniq-intelligence:local
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      PORT: "8000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_LOCAL_NAME:-visioniq}
      DB_INTELLIGENCE_USER: ${DB_INTELLIGENCE_USER:?Set DB_INTELLIGENCE_USER in .env}
      DB_INTELLIGENCE_PASSWORD: ${DB_INTELLIGENCE_PASSWORD:?Set DB_INTELLIGENCE_PASSWORD in .env}
      DB_SSL_MODE: disable
      TENANT_ID: ${TENANT_ID:-visioniq-dev}
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_PROJECT_ID: visioniq-local
      EVENTS_DISPATCH_ENABLED: "true"
      # BRF-03 brief pipeline: off unless BRIEF_PIPELINE_ENABLED=true. For a local run without Google
      # Cloud set LLM_MODE=offline and EMBEDDING_PROVIDER=test (never in production).
      BRIEF_PIPELINE_ENABLED: ${BRIEF_PIPELINE_ENABLED:-false}
      LLM_MODE: ${LLM_MODE:-live}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-vertex}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-europe-west3}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Decision D04: Claude stays off until a route and a data classification limit are set.
      CLAUDE_ROUTE: ${CLAUDE_ROUTE:-off}
      LLM_CLAUDE_MAX_CLASSIFICATION: ${LLM_CLAUDE_MAX_CLASSIFICATION:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      # Only read when CLAUDE_ROUTE=anthropic. Keep the key in .env (git-ignored), never in this file.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # DEF-01 to DEF-06 fix pipeline (deep analysis): off unless DEFECT_PIPELINE_ENABLED=true, and
      # then DEFECT_POLICY_FILE must name a policy inside the container (./config is mounted at
      # /app/config, e.g. /app/config/defect-policy.local.json). The image has git, so a
      # repository can be cloned here (check: python -m app.defect.clone_check). It has no test
      # runner and no Google credentials, so a complete fix run still needs the host
      # (docs/features/DEFECT-ARCHITECTURE.md).
      DEFECT_PIPELINE_ENABLED: ${DEFECT_PIPELINE_ENABLED:-false}
      DEFECT_POLICY_FILE: ${DEFECT_POLICY_FILE:-}
      # Read-only token (Code: Read) used only to clone a private repository; never the comment
      # or pull-request token. Keep it in .env (git-ignored), never in this file.
      DEFECT_REPO_READ_PAT: ${DEFECT_REPO_READ_PAT:-}
      DEFECT_REPO_TOKEN_HOSTS: ${DEFECT_REPO_TOKEN_HOSTS:-dev.azure.com}
      DEFECT_REPO_CACHE_DIR: ${DEFECT_REPO_CACHE_DIR:-}
      DEFECT_REPO_FETCH: ${DEFECT_REPO_FETCH:-full}
      DEFECT_MODEL_SELECTION: ${DEFECT_MODEL_SELECTION:-fixed}
      DEFECT_MODEL_SIMPLE: ${DEFECT_MODEL_SIMPLE:-}
      DEFECT_MODEL_STANDARD: ${DEFECT_MODEL_STANDARD:-}
      DEFECT_MODEL_COMPLEX: ${DEFECT_MODEL_COMPLEX:-}
      # BRF-08 hotspot sweep every N hours (0 = only on demand: python -m app.hotspots.cli).
      HOTSPOT_SWEEP_INTERVAL_HOURS: ${HOTSPOT_SWEEP_INTERVAL_HOURS:-0}
    volumes:
      # The fix policy (DEFECT_POLICY_FILE), read-only, as for the API's pickup policy.
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
