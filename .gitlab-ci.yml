# ==============================================================================
# M3S AI Hackathon 2026: Automated CI/CD Pipeline for Team PS04-T11 (VisionIQ)
# Monorepo services & jobs:
#   - visioniq-api (src/VisionIQ.Api) -> Cloud Run (Port 5100)
#   - visioniq-intelligence (src/VisionIQ.Intelligence) -> Cloud Run (Port 8000)
#   - visioniq-ingestor-webhooks (src/VisionIQ.Ingestor.Cli) -> Cloud Run (Port 8080)
#   - visioniq-db-migrate (db) -> Cloud Run Job
#   - visioniq-ingestion-job (src/VisionIQ.Ingestor.Cli) -> Cloud Run Job
#   - visioniq-indexing-job (src/VisionIQ.Intelligence) -> Cloud Run Job
# Keyless Kaniko build to Team GAR (europe-west1) & deploy to europe-west3
# ==============================================================================

include:
  - project: 'm3sacpc/m3sacpc-core'
    ref: 'main'
    file: '/templates/hackathon-ci.template.yml'

variables:
  SERVICE_REGION: "europe-west3"
  REGISTRY_REGION: "europe-west1"
  VPC_CONNECTOR: "vpc-con"
  DB_HOST: "10.102.16.8"
  DB_PORT: "5432"
  DB_NAME: "visioniq_dev"
  # Set GCS_EVIDENCE_BUCKET as a protected GitLab CI variable after verifying the canonical evidence bucket.
  # Do not silently choose between the legacy and team-owned buckets.

stages:
  - security
  - quality
  - build
  - test
  - migrate
  - deploy
  - verify

# ------------------------------------------------------------------------------
# Security Overrides: Prevent informational warnings from blocking automated deploy
# ------------------------------------------------------------------------------
semgrep-sast:
  allow_failure: true

# ------------------------------------------------------------------------------
# Keyless GCP Session & Docker Auth Preparation
# ------------------------------------------------------------------------------
prepare-gcp-session:
  stage: build
  extends: .gcp_base
  before_script:
    - !reference [.bootstrap_template, before_script]
    - command -v python3 >/dev/null || ln -s /usr/lib/google-cloud-sdk/platform/bundledpythonunix/bin/python3 /usr/local/bin/python3
    - !reference [.gcp_base, before_script]
  script:
    - mkdir -p gcp-session
    - AUTH=$(echo -n "oauth2accesstoken:${GOOGLE_OAUTH_ACCESS_TOKEN}" | base64 | tr -d '\n')
    - echo "{\"auths\":{\"https://${REGISTRY_REGION}-docker.pkg.dev\":{\"auth\":\"$AUTH\"}}}" > gcp-session/docker-config.json
    - |
      cat <<EOF > gcp-session/gcp.env
      TEAM_SLUG=${TEAM_SLUG}
      TEAM_SA=${TEAM_SA}
      TEAM_GAR=${REGISTRY_REGION}-docker.pkg.dev/${GCP_PROJECT}/docker-${TEAM_SLUG}
      GCP_PROJECT=${GCP_PROJECT}
      SERVICE_REGION=${SERVICE_REGION}
      API_IMAGE=${REGISTRY_REGION}-docker.pkg.dev/${GCP_PROJECT}/docker-${TEAM_SLUG}/visioniq-api:${CI_COMMIT_SHORT_SHA}
      INTELLIGENCE_IMAGE=${REGISTRY_REGION}-docker.pkg.dev/${GCP_PROJECT}/docker-${TEAM_SLUG}/visioniq-intelligence:${CI_COMMIT_SHORT_SHA}
      INGESTOR_IMAGE=${REGISTRY_REGION}-docker.pkg.dev/${GCP_PROJECT}/docker-${TEAM_SLUG}/visioniq-ingestor-webhooks:${CI_COMMIT_SHORT_SHA}
      MIGRATE_IMAGE=${REGISTRY_REGION}-docker.pkg.dev/${GCP_PROJECT}/docker-${TEAM_SLUG}/visioniq-db-migrate:${CI_COMMIT_SHORT_SHA}
      EOF
    - echo "GCP Keyless Session prepared for ${TEAM_SLUG} (${TEAM_SA})."
  artifacts:
    paths:
      - gcp-session/docker-config.json
    reports:
      dotenv: gcp-session/gcp.env
    expire_in: 24 hours
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# -------------------------------------------------------------------------------
# Static cloud checks (do not require GCP credentials; run in merge requests too)
# -------------------------------------------------------------------------------
cloud-static-checks:
  stage: quality
  image: python:3.12-slim
  tags:
    - kazan-S
  before_script: []
  script:
    - python scripts/cloud/validate_contracts.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ------------------------------------------------------------------------------
# Kaniko Container Builds (Parallel execution into Team Artifact Registry)
# ------------------------------------------------------------------------------
build-api:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script: []
  needs:
    - job: prepare-gcp-session
      artifacts: true
  tags:
    - kazan-S
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - mkdir -p /kaniko/.docker
    - cp gcp-session/docker-config.json /kaniko/.docker/config.json
    - echo "Building VisionIQ.Api container..."
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}"
        --dockerfile "${CI_PROJECT_DIR}/src/VisionIQ.Api/Dockerfile"
        --destination "${API_IMAGE}"
        --destination "${TEAM_GAR}/visioniq-api:latest"

build-intelligence:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script: []
  needs:
    - job: prepare-gcp-session
      artifacts: true
  tags:
    - kazan-S
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - mkdir -p /kaniko/.docker
    - cp gcp-session/docker-config.json /kaniko/.docker/config.json
    - echo "Building VisionIQ.Intelligence container..."
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}"
        --dockerfile "${CI_PROJECT_DIR}/src/VisionIQ.Intelligence/Dockerfile"
        --destination "${INTELLIGENCE_IMAGE}"
        --destination "${TEAM_GAR}/visioniq-intelligence:latest"

build-ingestor-webhooks:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script: []
  needs:
    - job: prepare-gcp-session
      artifacts: true
  tags:
    - kazan-S
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - mkdir -p /kaniko/.docker
    - cp gcp-session/docker-config.json /kaniko/.docker/config.json
    - echo "Building VisionIQ.Ingestor.Cli container..."
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}"
        --dockerfile "${CI_PROJECT_DIR}/src/VisionIQ.Ingestor.Cli/Dockerfile"
        --destination "${INGESTOR_IMAGE}"
        --destination "${TEAM_GAR}/visioniq-ingestor-webhooks:latest"

build-db-migrate:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script: []
  needs:
    - job: prepare-gcp-session
      artifacts: true
  tags:
    - kazan-S
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - mkdir -p /kaniko/.docker
    - cp gcp-session/docker-config.json /kaniko/.docker/config.json
    - echo "Building VisionIQ.DbMigrate container..."
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}"
        --dockerfile "${CI_PROJECT_DIR}/db/Dockerfile"
        --destination "${MIGRATE_IMAGE}"
        --destination "${TEAM_GAR}/visioniq-db-migrate:latest"

# ------------------------------------------------------------------------------
# Database Migration Gate: Update definition & execute before service rollout
# ------------------------------------------------------------------------------
deploy-and-run-db-migrate:
  stage: migrate
  extends: .gcp_base
  needs:
    - job: prepare-gcp-session
    - job: build-db-migrate
  # Migration is a blocking manual gate; no application rollout until approved.
  # Do not execute migrations automatically on each main push.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
  before_script:
    - !reference [.bootstrap_template, before_script]
    - command -v python3 >/dev/null || ln -s /usr/lib/google-cloud-sdk/platform/bundledpythonunix/bin/python3 /usr/local/bin/python3
    - !reference [.gcp_base, before_script]
  script:
    - ': "${DB_CLOUD_USER:?Set approved DB_CLOUD_USER CI variable (do not use the runtime DB user)}"'
    - echo "Deploying updated visioniq-db-migrate Cloud Run Job under ${TEAM_SA}..."
    - gcloud run jobs deploy "visioniq-db-migrate"
        --image "${MIGRATE_IMAGE}"
        --region "${SERVICE_REGION}"
        --project "${GCP_PROJECT}"
        --service-account "${TEAM_SA}"
        --vpc-connector "${VPC_CONNECTOR}"
        --vpc-egress "private-ranges-only"
        --command "python"
        --args "-m,db.cloud_manage,all,--instance,${GCP_PROJECT}:${SERVICE_REGION}:visioniqdev"
        --max-retries 0
        --task-timeout 900s
        --labels "wl-team=ps04-t11,team=ps04-t11,pocid=ps04-t11,event=hackathon-2026,env=sandbox,app=visioniq"
        --set-env-vars "DB_TARGET=cloud,DB_CLOUD_INSTANCE=${GCP_PROJECT}:${SERVICE_REGION}:visioniqdev,GCP_PROJECT_ID=${GCP_PROJECT},DB_HOST=${DB_HOST},DB_PORT=${DB_PORT},DB_CLOUD_NAME=${DB_NAME},DB_CLOUD_USER=${DB_CLOUD_USER},DB_API_USER=visioniq_api,DB_INTELLIGENCE_USER=visioniq_intelligence,VISIONIQ_CLOUD_RUN_MIGRATIONS=approved"
        --set-secrets "DB_CLOUD_PASSWORD=visioniq-db-admin-password:latest,DB_CLOUD_API_PASSWORD=visioniq-db-api-password:latest,DB_CLOUD_INTELLIGENCE_PASSWORD=visioniq-db-intelligence-password:latest"
    - echo "Executing database migrations with --wait (pipeline halts if migrations fail)..."
    - gcloud run jobs execute "visioniq-db-migrate" --region "${SERVICE_REGION}" --project "${GCP_PROJECT}" --wait

# ------------------------------------------------------------------------------
# Automated Cloud Run Deployments (Under Team SA in europe-west3)
# ------------------------------------------------------------------------------
deploy-visioniq-api:
  stage: deploy
  extends: .gcp_base
  needs:
    - job: prepare-gcp-session
    - job: build-api
    - job: deploy-and-run-db-migrate
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - !reference [.bootstrap_template, before_script]
    - command -v python3 >/dev/null || ln -s /usr/lib/google-cloud-sdk/platform/bundledpythonunix/bin/python3 /usr/local/bin/python3
    - !reference [.gcp_base, before_script]
  script:
    - ': "${GCS_EVIDENCE_BUCKET:?Set the approved evidence bucket in GitLab CI variables}"'
    - echo "Deploying visioniq-api to Cloud Run under ${TEAM_SA} on port 5100..."
    - gcloud run deploy "visioniq-api"
        --image "${API_IMAGE}"
        --region "${SERVICE_REGION}"
        --project "${GCP_PROJECT}"
        --service-account "${TEAM_SA}"
        --port 5100
        --ingress "internal-and-cloud-load-balancing"
        --vpc-connector "${VPC_CONNECTOR}"
        --vpc-egress "private-ranges-only"
        --min-instances 0
        --max-instances 2
        --memory "1Gi"
        --cpu 1
        --labels "wl-team=ps04-t11,team=ps04-t11,pocid=ps04-t11,event=hackathon-2026,env=sandbox,app=visioniq"
        --set-env-vars "ASPNETCORE_ENVIRONMENT=Production,DB_HOST=${DB_HOST},DB_PORT=${DB_PORT},DB_NAME=${DB_NAME},DB_API_USER=visioniq_api,DB_SSL_MODE=require,TENANT_ID=visioniq-dev,PUBSUB_PROJECT_ID=${GCP_PROJECT},EVENTS_DISPATCH_ENABLED=false,BRIEF_PUBLISH_MODE=off,FIX_PR_MODE=off,PICKUP_SWEEP_INTERVAL_MINUTES=0"
        --set-secrets "DB_API_PASSWORD=visioniq-db-api-password:latest"
    - gcloud run services describe "visioniq-api" --region "${SERVICE_REGION}" --format='value(status.url)'

deploy-visioniq-intelligence:
  stage: deploy
  extends: .gcp_base
  needs:
    - job: prepare-gcp-session
    - job: build-intelligence
    - job: deploy-and-run-db-migrate
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - !reference [.bootstrap_template, before_script]
    - command -v python3 >/dev/null || ln -s /usr/lib/google-cloud-sdk/platform/bundledpythonunix/bin/python3 /usr/local/bin/python3
    - !reference [.gcp_base, before_script]
  script:
    - ': "${GCS_EVIDENCE_BUCKET:?Set the approved evidence bucket in GitLab CI variables}"'
    - echo "Deploying visioniq-intelligence to Cloud Run under ${TEAM_SA} on port 8000..."
    - gcloud run deploy "visioniq-intelligence"
        --image "${INTELLIGENCE_IMAGE}"
        --region "${SERVICE_REGION}"
        --project "${GCP_PROJECT}"
        --service-account "${TEAM_SA}"
        --port 8000
        --ingress "internal-and-cloud-load-balancing"
        --vpc-connector "${VPC_CONNECTOR}"
        --vpc-egress "private-ranges-only"
        --min-instances 0
        --max-instances 2
        --memory "2Gi"
        --cpu 1
        --labels "wl-team=ps04-t11,team=ps04-t11,pocid=ps04-t11,event=hackathon-2026,env=sandbox,app=visioniq"
        --set-env-vars "APP_ENV=production,DB_HOST=${DB_HOST},DB_PORT=${DB_PORT},DB_NAME=${DB_NAME},DB_INTELLIGENCE_USER=visioniq_intelligence,DB_SSL_MODE=require,TENANT_ID=visioniq-dev,PUBSUB_PROJECT_ID=${GCP_PROJECT},EVENTS_DISPATCH_ENABLED=false,BRIEF_PIPELINE_ENABLED=false,DEFECT_PIPELINE_ENABLED=false,CLAUDE_ROUTE=off,LLM_MODE=live,GCS_EVIDENCE_BUCKET=${GCS_EVIDENCE_BUCKET},EMBEDDING_PROVIDER=vertex,EMBEDDING_MODEL=gemini-embedding-001,EMBEDDING_DIMENSION=768,VERTEX_LOCATION=${SERVICE_REGION},GCP_PROJECT_ID=${GCP_PROJECT},GEMINI_MODEL=gemini-2.5-flash"
        --set-secrets "DB_INTELLIGENCE_PASSWORD=visioniq-db-intelligence-password:latest"
    - gcloud run services describe "visioniq-intelligence" --region "${SERVICE_REGION}" --format='value(status.url)'

deploy-visioniq-ingestor-webhooks:
  stage: deploy
  extends: .gcp_base
  needs:
    - job: prepare-gcp-session
    - job: build-ingestor-webhooks
    - job: deploy-and-run-db-migrate
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - !reference [.bootstrap_template, before_script]
    - command -v python3 >/dev/null || ln -s /usr/lib/google-cloud-sdk/platform/bundledpythonunix/bin/python3 /usr/local/bin/python3
    - !reference [.gcp_base, before_script]
  script:
    - ': "${GCS_EVIDENCE_BUCKET:?Set the approved evidence bucket in GitLab CI variables}"'
    - echo "Deploying visioniq-ingestor-webhooks to Cloud Run under ${TEAM_SA} on port 8080..."
    - gcloud run deploy "visioniq-ingestor-webhooks"
        --image "${INGESTOR_IMAGE}"
        --region "${SERVICE_REGION}"
        --project "${GCP_PROJECT}"
        --service-account "${TEAM_SA}"
        --port 8080
        --ingress "internal"
        --no-allow-unauthenticated
        --vpc-connector "${VPC_CONNECTOR}"
        --vpc-egress "private-ranges-only"
        --min-instances 0
        --max-instances 2
        --memory "1Gi"
        --cpu 1
        --labels "wl-team=ps04-t11,team=ps04-t11,pocid=ps04-t11,event=hackathon-2026,env=sandbox,app=visioniq"
        --set-env-vars "INGESTION_OUTPUT_MODE=canonical,CHECKPOINT_STORE=postgres,GCS_EVIDENCE_BUCKET=${GCS_EVIDENCE_BUCKET},DB_HOST=${DB_HOST},DB_PORT=${DB_PORT},DB_NAME=${DB_NAME},DB_API_USER=visioniq_api,DB_SSL_MODE=require,TENANT_ID=visioniq-dev,ADO_ORG_URL=https://dev.azure.com/WLMTS,ADO_PROJECTS=Genoa Kiosk,ADO_WEBHOOK_USERNAME=visioniq-webhook"
        --set-secrets "DB_API_PASSWORD=visioniq-db-api-password:latest,DB_PASSWORD=visioniq-db-api-password:latest,ADO_WEBHOOK_SECRET=visioniq-ado-webhook-secret:latest,ADO_READ_PAT=visioniq-ado-read-pat:latest"
    - gcloud run services describe "visioniq-ingestor-webhooks" --region "${SERVICE_REGION}" --format='value(status.url)'

deploy-visioniq-ingestion-job:
  stage: deploy
  extends: .gcp_base
  needs:
    - job: prepare-gcp-session
    - job: build-ingestor-webhooks
    - job: deploy-and-run-db-migrate
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - !reference [.bootstrap_template, before_script]
    - command -v python3 >/dev/null || ln -s /usr/lib/google-cloud-sdk/platform/bundledpythonunix/bin/python3 /usr/local/bin/python3
    - !reference [.gcp_base, before_script]
  script:
    - ': "${GCS_EVIDENCE_BUCKET:?Set the approved evidence bucket in GitLab CI variables}"'
    - echo "Deploying visioniq-ingestion-job Cloud Run Job under ${TEAM_SA}..."
    - gcloud run jobs deploy "visioniq-ingestion-job"
        --image "${INGESTOR_IMAGE}"
        --region "${SERVICE_REGION}"
        --project "${GCP_PROJECT}"
        --service-account "${TEAM_SA}"
        --vpc-connector "${VPC_CONNECTOR}"
        --vpc-egress "private-ranges-only"
        --command "dotnet"
        --args "VisionIQ.Ingestor.Cli.dll,sync,--source,all"
        --labels "wl-team=ps04-t11,team=ps04-t11,pocid=ps04-t11,event=hackathon-2026,env=sandbox,app=visioniq"
        --set-env-vars "INGESTION_OUTPUT_MODE=canonical,CHECKPOINT_STORE=postgres,GCS_EVIDENCE_BUCKET=${GCS_EVIDENCE_BUCKET},DB_HOST=${DB_HOST},DB_PORT=${DB_PORT},DB_NAME=${DB_NAME},DB_API_USER=visioniq_api,DB_SSL_MODE=require,TENANT_ID=visioniq-dev,ADO_ORG_URL=https://dev.azure.com/WLMTS,ADO_PROJECTS=Genoa Kiosk"
        --set-secrets "DB_API_PASSWORD=visioniq-db-api-password:latest,ADO_READ_PAT=visioniq-ado-read-pat:latest"

deploy-visioniq-indexing-job:
  stage: deploy
  extends: .gcp_base
  needs:
    - job: prepare-gcp-session
    - job: build-intelligence
    - job: deploy-and-run-db-migrate
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - !reference [.bootstrap_template, before_script]
    - command -v python3 >/dev/null || ln -s /usr/lib/google-cloud-sdk/platform/bundledpythonunix/bin/python3 /usr/local/bin/python3
    - !reference [.gcp_base, before_script]
  script:
    - ': "${GCS_EVIDENCE_BUCKET:?Set the approved evidence bucket in GitLab CI variables}"'
    - echo "Deploying visioniq-indexing-job Cloud Run Job under ${TEAM_SA}..."
    - gcloud run jobs deploy "visioniq-indexing-job"
        --image "${INTELLIGENCE_IMAGE}"
        --region "${SERVICE_REGION}"
        --project "${GCP_PROJECT}"
        --service-account "${TEAM_SA}"
        --vpc-connector "${VPC_CONNECTOR}"
        --vpc-egress "private-ranges-only"
        --command "python"
        --args "-m,app.knowledge.index_cli"
        --labels "wl-team=ps04-t11,team=ps04-t11,pocid=ps04-t11,event=hackathon-2026,env=sandbox,app=visioniq"
        --set-env-vars "APP_ENV=production,DB_HOST=${DB_HOST},DB_PORT=${DB_PORT},DB_NAME=${DB_NAME},DB_INTELLIGENCE_USER=visioniq_intelligence,DB_SSL_MODE=require,GCS_EVIDENCE_BUCKET=${GCS_EVIDENCE_BUCKET},EMBEDDING_PROVIDER=vertex,VERTEX_LOCATION=${SERVICE_REGION},GCP_PROJECT_ID=${GCP_PROJECT}"
        --set-secrets "DB_INTELLIGENCE_PASSWORD=visioniq-db-intelligence-password:latest"

# ------------------------------------------------------------------------------
# Post-deployment metadata verification: no mutation.
# ------------------------------------------------------------------------------
cloud-deployment-readiness:
  stage: verify
  extends: .gcp_base
  needs:
    - job: prepare-gcp-session
      artifacts: true
    - job: deploy-visioniq-api
    - job: deploy-visioniq-intelligence
    - job: deploy-visioniq-ingestor-webhooks
    - job: deploy-visioniq-ingestion-job
    - job: deploy-visioniq-indexing-job
  before_script:
    - !reference [.bootstrap_template, before_script]
    - !reference [.gcp_base, before_script]
  script:
    - bash scripts/cloud/verify-cloud-run.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

