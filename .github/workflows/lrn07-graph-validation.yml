name: LRN-07 graph contract validation

on:
  pull_request:
    paths:
      - "src/VisionIQ.Api/Features/Graph/**"
      - "src/VisionIQ.Api/Features/GraphApi/**"
      - "src/VisionIQ.Api/Program.cs"
      - "tests/VisionIQ.Api.Tests/**"
      - "scripts/learn_e2e.py"
      - "scripts/inspect_graph.py"
      - "tests/intelligence/test_lrn07_graph_inspector.py"
      - ".github/workflows/lrn07-graph-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-graph:
    name: LRN-07 graph and API safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build and run API tests (graph, lifecycle and disabled graph HTTP)
        run: dotnet test tests/VisionIQ.Api.Tests/VisionIQ.Api.Tests.csproj --configuration Release
      - name: Validate local LEARN graph runner syntax
        run: python -m py_compile scripts/learn_e2e.py

  local-inspector:
    name: LRN-07 local graph inspector contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated local-inspector checks
        run: python -m pip install pytest ruff "psycopg[binary]"
      - name: Run Python graph inspector regression tests
        run: python -m pytest -q tests/intelligence/test_lrn07_graph_inspector.py
      - name: Verify lint and syntax of new operator CLI
        run: |
          python -m py_compile scripts/inspect_graph.py
          python -m ruff check scripts/inspect_graph.py tests/intelligence/test_lrn07_graph_inspector.py
