name: LRN-13 manual learning verification
on:
  pull_request:
    paths:
      - "src/VisionIQ.Intelligence/app/knowledge/lrn13_manual_cli.py"
      - "tests/intelligence/test_lrn13_manual.py"
      - "tests/intelligence/test_lrn13_manual_db.py"
      - ".github/workflows/lrn13-manual-learning.yml"
  workflow_dispatch:
jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Operator fail-closed unit checks
        env:
          PYTHONPATH: src/VisionIQ.Intelligence
        run: python -m pytest -q tests/intelligence/test_lrn13_manual.py
      - name: Lint manual workflow and its tests
        run: >-
          python -m ruff check
          src/VisionIQ.Intelligence/app/knowledge/lrn13_manual_cli.py
          tests/intelligence/test_lrn13_manual.py
          tests/intelligence/test_lrn13_manual_db.py

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_TARGET: local
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DB_LOCAL_NAME: visioniq
      DB_LOCAL_USER: visioniq
      DB_LOCAL_PASSWORD: ci-lrn13-admin-local-only
      DB_API_USER: visioniq_api
      DB_API_PASSWORD: ci-lrn13-api-local-only
      DB_INTELLIGENCE_USER: visioniq_intelligence
      DB_INTELLIGENCE_PASSWORD: ci-lrn13-intelligence-local-only
      DB_SSL_MODE: disable
      PYTHONPATH: src/VisionIQ.Intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Start disposable pgvector PostgreSQL
        run: docker compose up --wait -d postgres
      - name: Test manual lifecycle and existing LRN-13 in separate databases
        run: >-
          python scripts/learn_e2e_stages.py isolated-pytest
          tests/intelligence/test_lrn13_manual_db.py
          tests/intelligence/test_lrn13_db.py
      - name: Print failed suite output
        if: failure()
        run: |
          find artifacts/learn-e2e/isolated-pytest -type f -name '*.log' -exec sh -c 'echo "::group::$1"; tail -n 130 "$1"; echo "::endgroup::"' _ {} \;
      - name: Tear down CI-only database volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
