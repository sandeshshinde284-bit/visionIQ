name: Pull request validation

on:
  pull_request:
  push:
    branches:
      - feature/fnd03-sqlalchemy-alembic-local
      - feature/learn

permissions:
  contents: read

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
        env:
          PYTHONPATH: src/VisionIQ.Intelligence

  dotnet:
    name: .NET 10 build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test VisionIQ.sln --configuration Release

  containers:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Intelligence runtime image
        run: docker build -f src/VisionIQ.Intelligence/Dockerfile -t visioniq-intelligence:ci .
      - name: Build migration image
        run: docker build -f db/Dockerfile -t visioniq-db-migrate:ci .

  fresh-postgres:
    name: Fresh-volume migration and rerun
    runs-on: ubuntu-latest
    env:
      DB_TARGET: local
      DB_LOCAL_NAME: visioniq
      DB_LOCAL_USER: visioniq
      DB_LOCAL_PASSWORD: ci-fnd03-admin-local-only
      DB_API_USER: visioniq_api
      DB_API_PASSWORD: ci-fnd03-api-local-only
      DB_INTELLIGENCE_USER: visioniq_intelligence
      DB_INTELLIGENCE_PASSWORD: ci-fnd03-intelligence-local-only
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: Initialize empty PostgreSQL volume and run migrations
        run: docker compose run --build --rm db-migrate
      - name: Repeat migration and role verification against existing volume
        run: docker compose run --rm db-migrate
      - name: Assert expected revision and schemas
        run: |
          revision=$(docker compose exec -T postgres psql -U visioniq -d visioniq -Atc "SELECT version_num FROM public.alembic_version")
          test "$revision" = "20261030_0003"
          schemas=$(docker compose exec -T postgres psql -U visioniq -d visioniq -Atc "SELECT count(*) FROM information_schema.schemata WHERE schema_name IN ('workflow','evidence','knowledge')")
          test "$schemas" = "3"
          extension=$(docker compose exec -T postgres psql -U visioniq -d visioniq -Atc "SELECT extname FROM pg_extension WHERE extname='vector'")
          test "$extension" = "vector"
          tables=$(docker compose exec -T postgres psql -U visioniq -d visioniq -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='evidence' AND table_name IN ('source_items','source_revisions')")
          test "$tables" = "2"
          checkpoint=$(docker compose exec -T postgres psql -U visioniq -d visioniq -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='evidence' AND table_name='connector_checkpoints'")
          test "$checkpoint" = "1"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify LRN-03 actual database idempotency and revisions
        env:
          VISIONIQ_EVIDENCE_DB_INTEGRATION: "1"
          DB_HOST: "127.0.0.1"
          DB_NAME: "visioniq"
        run: dotnet test VisionIQ.sln --configuration Release --filter "FullyQualifiedName~EvidenceDatabaseIntegrationTests"
      - name: Capture container status on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=100 postgres
      - name: Destroy CI-only disposable volume
        if: always()
        run: docker compose down --volumes --remove-orphans
