# Tool configuration only (Ruff and pytest). Dependencies live in the single root requirements.txt.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src/VisionIQ.Intelligence", "tests"]
extend-exclude = [".venv", "venv", "build", "dist", "**/bin", "**/obj", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests/intelligence"]
pythonpath = ["src/VisionIQ.Intelligence"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
